<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blade Duels</title>
<meta name="description" content="Torneo de duelos de armas blancas: elegí dirección, ataque y bloqueo contra el bot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-neon">
<div id="app">
  <div class="topbar">
    <h1>Blade Duels</h1>
    <div class="tools">
      <button class="chip" id="btn-theme" type="button">Estilo: Neón</button>
      <button class="chip" id="btn-sound" type="button" aria-pressed="true">Sonido: sí</button>
      <button class="chip" id="btn-speed" type="button">Velocidad ×1</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv" aria-label="Escena del duelo"></canvas>
    <div id="overlay" role="dialog" aria-live="polite"></div>
  </div>
  <div id="panel" class="locked">
    <div id="hint"></div>
    <div class="grp"><h4>1 · Ataque</h4><div class="row types" id="types"></div></div>
    <div class="pair">
      <div class="grp"><h4>2 · Dirección del ataque</h4><div class="row zones" id="azones"></div></div>
      <div class="grp"><h4>3 · Bloqueo</h4><div class="row zones" id="bzones"></div></div>
    </div>
    <button id="go" type="button" disabled>¡Golpear!</button>
    <div id="reader"></div>
  </div>
</div>
<script src="core.js"></script>
<script src="ai.js"></script>
<script src="audio.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>
</body>
</html>
