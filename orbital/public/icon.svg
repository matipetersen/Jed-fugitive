<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="url(#bg)"/>
<defs>
  <radialGradient id="bg" cx="50%" cy="72%" r="85%">
    <stop offset="0" stop-color="#2a0e5c"/><stop offset=".55" stop-color="#0b0624"/><stop offset="1" stop-color="#02020a"/>
  </radialGradient>
  <linearGradient id="pl" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff2bd6"/><stop offset="1" stop-color="#7a5cff"/>
  </linearGradient>
  <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#ffb000" stop-opacity="0"/><stop offset="1" stop-color="#ffb000" stop-opacity=".95"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="cut"><rect width="512" height="512"/></clipPath>
</defs>
<g clip-path="url(#cut)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- stars -->
  <g fill="#9bb8ff" stroke="none" opacity=".85"><circle cx="62" cy="88" r="2.2"/><circle cx="118" cy="190" r="1.6"/><circle cx="452" cy="120" r="2.4"/><circle cx="410" cy="238" r="1.6"/><circle cx="40" cy="300" r="1.8"/><circle cx="470" cy="330" r="2"/><circle cx="196" cy="52" r="1.6"/></g>
  <g fill="#ff2bd6" stroke="none" opacity=".8"><circle cx="86" cy="140" r="1.8"/><circle cx="440" cy="60" r="1.6"/></g>
  <!-- planet: a wireframe sphere rising from below -->
  <g filter="url(#soft)">
    <circle cx="256" cy="438" r="190" stroke="url(#pl)" stroke-width="11"/>
    <circle cx="256" cy="438" r="150" stroke="#b46bff" stroke-width="3" opacity=".5"/>
    <circle cx="256" cy="438" r="108" stroke="#b46bff" stroke-width="3" opacity=".4"/>
    <path d="M70 400 Q256 350 442 400" stroke="#ff2bd6" stroke-width="3" opacity=".55"/>
    <path d="M86 340 Q256 280 426 340" stroke="#ff2bd6" stroke-width="3" opacity=".4"/>
  </g>
  <!-- orbit ring -->
  <circle cx="256" cy="438" r="262" stroke="#2f7bff" stroke-width="5" stroke-dasharray="3 15" opacity=".85"/>
  <!-- gate ring on the path -->
  <g filter="url(#soft)"><circle cx="150" cy="178" r="34" stroke="#ffb000" stroke-width="7" stroke-dasharray="14 9"/><circle cx="150" cy="178" r="18" stroke="#ff2bd6" stroke-width="3" stroke-dasharray="4 8" opacity=".85"/></g>
  <!-- trail of the ship along the orbit -->
  <path d="M120 322 Q 230 252 332 160" stroke="url(#trail)" stroke-width="12" filter="url(#glow)"/>
  <path d="M120 322 Q 230 252 332 160" stroke="#ffffff" stroke-width="3" opacity=".7"/>
  <!-- ship -->
  <g transform="translate(352 142) rotate(-48)" filter="url(#glow)">
    <path d="M62 0 L-34 36 L-18 0 L-34 -36 Z" stroke="#00f0ff" stroke-width="13"/>
    <path d="M62 0 L-34 36 L-18 0 L-34 -36 Z" stroke="#ffffff" stroke-width="4"/>
    <path d="M-26 14 L-62 0 L-26 -14" stroke="#ff2bd6" stroke-width="8"/>
    <path d="M-44 8 L-98 0 L-44 -8" stroke="#ffb000" stroke-width="6" opacity=".9"/>
  </g>
</g>
</svg>